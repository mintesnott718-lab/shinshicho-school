<!DOCTYPE html>
<html>
<head>
    <title>Teacher Registration - SSS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eef5ff;
            color: #123;
        }

        .box {
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,.12);
        }

        h1 {
            color: #0759b8;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0 15px;
            box-sizing: border-box;
            border: 1px solid #ccd6e0;
            border-radius: 8px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 8px;
            background: #0759b8;
            color: white;
            font-size: 16px;
        }

        .error {
            color: #b00020;
        }

        .success {
            color: #08752b;
        }

        a {
            color: #0759b8;
        }
    </style>
</head>
<body>

<div class="box">
    <h1>Teacher Registration</h1>
    <p>Shinshicho Sinary Secondary School</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="success">{{ success }}</p>
    {% endif %}

    <form method="POST">

        <label>Full Name</label>
        <input type="text" name="full_name" required>

        <label>Username</label>
        <input type="text" name="username" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <label>Phone</label>
        <input type="text" name="phone">

        <label>Subject</label>
        <input type="text" name="subject" placeholder="e.g. Mathematics" required>

        <button type="submit">Register as Teacher</button>

    </form>

    <p>
        Already registered?
        <a href="/teacher/login">Teacher Login</a>
    </p>

    <p>
        <a href="/">← Back to school home</a>
    </p>
</div>

</body>
</html>
